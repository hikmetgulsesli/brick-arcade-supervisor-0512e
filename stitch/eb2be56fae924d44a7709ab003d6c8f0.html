<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pause Overlay - SUPERVISOR_OS_V1</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;800&amp;family=JetBrains+Mono:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#091009",
                        "on-secondary": "#472a00",
                        "surface": "#0e150e",
                        "on-secondary-fixed-variant": "#653e00",
                        "on-primary": "#003915",
                        "on-secondary-fixed": "#2a1700",
                        "on-primary-fixed-variant": "#005321",
                        "secondary-fixed-dim": "#ffb95f",
                        "secondary-container": "#ee9800",
                        "primary-fixed": "#6bff8f",
                        "surface-variant": "#2f372e",
                        "on-secondary-container": "#5b3800",
                        "surface-container-low": "#161d16",
                        "outline": "#869585",
                        "on-error-container": "#ffdad6",
                        "surface-bright": "#333b33",
                        "background": "#0e150e",
                        "on-tertiary-fixed-variant": "#92002a",
                        "on-background": "#dce5d9",
                        "on-primary-container": "#004b1e",
                        "primary-fixed-dim": "#4ae176",
                        "tertiary": "#ffb3b7",
                        "error-container": "#93000a",
                        "on-surface-variant": "#bccbb9",
                        "primary": "#4be277",
                        "on-tertiary": "#67001b",
                        "surface-container": "#1a221a",
                        "inverse-surface": "#dce5d9",
                        "inverse-primary": "#006e2f",
                        "surface-dim": "#0e150e",
                        "inverse-on-surface": "#2a322a",
                        "primary-container": "#22c55e",
                        "tertiary-fixed": "#ffdadb",
                        "on-error": "#690005",
                        "secondary": "#ffb95f",
                        "surface-container-highest": "#2f372e",
                        "tertiary-fixed-dim": "#ffb2b7",
                        "on-primary-fixed": "#002109",
                        "surface-container-high": "#242c24",
                        "on-tertiary-container": "#840025",
                        "tertiary-container": "#ff8892",
                        "surface-tint": "#4ae176",
                        "error": "#ffb4ab",
                        "on-surface": "#dce5d9",
                        "on-tertiary-fixed": "#40000d",
                        "secondary-fixed": "#ffddb8",
                        "outline-variant": "#3d4a3d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "margin-mobile": "16px",
                        "gutter": "16px",
                        "margin-desktop": "32px",
                        "touch-target": "44px"
                    },
                    "fontFamily": {
                        "body-md": ["Hanken Grotesk"],
                        "hud-sm": ["JetBrains Mono"],
                        "hud-lg": ["Hanken Grotesk"],
                        "label-bold": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "hud-sm": ["12px", { "lineHeight": "1.0", "letterSpacing": "0.1em", "fontWeight": "700" }],
                        "hud-lg": ["32px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "label-bold": ["14px", { "lineHeight": "1.2", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .glow-primary {
            box-shadow: 0 0 10px rgba(75, 226, 119, 0.5); /* using primary color */
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen font-body-md overflow-hidden relative">
<!-- Mock Background Game State -->
<div class="absolute inset-0 z-0 bg-surface-container-lowest opacity-40 blur-sm pointer-events-none flex flex-col justify-center items-center gap-4">
<div class="w-64 h-16 bg-surface border border-outline-variant rounded flex justify-center items-center">
<span class="font-hud-sm text-hud-sm text-on-surface-variant">GAME ENTITY</span>
</div>
<div class="w-16 h-16 bg-primary-container rounded-full glow-primary"></div>
<div class="grid grid-cols-5 gap-unit">
<div class="w-12 h-6 bg-primary-container"></div>
<div class="w-12 h-6 bg-error"></div>
<div class="w-12 h-6 bg-primary-container"></div>
<div class="w-12 h-6 bg-primary-container"></div>
<div class="w-12 h-6 bg-secondary"></div>
</div>
</div>
<!-- Pause Overlay Canvas -->
<div class="relative z-50 w-full h-screen flex flex-col items-center justify-center bg-surface-dim/80 backdrop-blur-md px-margin-mobile">
<!-- Pause Menu Container -->
<div class="w-full max-w-sm flex flex-col items-center gap-8">
<!-- Header -->
<div class="text-center flex flex-col items-center gap-2">
<span class="material-symbols-outlined text-4xl text-primary" style="font-variation-settings: 'FILL' 1;">pause_circle</span>
<h1 class="font-hud-lg text-hud-lg text-primary uppercase tracking-widest drop-shadow-[0_0_8px_rgba(75,226,119,0.8)]">GAME PAUSED</h1>
<p class="font-hud-sm text-hud-sm text-on-surface-variant uppercase mt-2">SYSTEM STANDBY</p>
</div>
<!-- Action Buttons -->
<div class="flex flex-col w-full gap-4 mt-8">
<!-- Primary Action: Resume -->
<button class="h-touch-target w-full bg-primary-container/20 border-2 border-primary text-primary font-label-bold text-label-bold uppercase flex items-center justify-center gap-2 hover:bg-primary-container/30 hover:shadow-[0_0_12px_rgba(75,226,119,0.6)] transition-all duration-200 outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-dim group">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">play_arrow</span>
                    RESUME
                </button>
<!-- Secondary Action: Restart -->
<button class="h-touch-target w-full bg-surface border border-outline-variant text-on-surface font-label-bold text-label-bold uppercase flex items-center justify-center gap-2 hover:border-primary hover:text-primary transition-all duration-200 outline-none focus:border-primary focus:text-primary">
<span class="material-symbols-outlined">restart_alt</span>
                    RESTART
                </button>
<!-- Secondary Action: Return to Menu -->
<button class="h-touch-target w-full bg-surface border border-outline-variant text-on-surface font-label-bold text-label-bold uppercase flex items-center justify-center gap-2 hover:border-error hover:text-error transition-all duration-200 outline-none focus:border-error focus:text-error mt-4">
<span class="material-symbols-outlined">exit_to_app</span>
                    RETURN TO MENU
                </button>
</div>
<!-- HUD Data Snippet -->
<div class="flex gap-4 mt-8 border-t border-outline-variant pt-8 w-full justify-center">
<div class="flex flex-col items-center justify-center border border-outline-variant bg-surface px-4 py-2 rounded-sm min-w-[80px]">
<span class="font-hud-sm text-hud-sm text-on-surface-variant mb-1">SCORE</span>
<span class="font-label-bold text-label-bold text-primary">12,450</span>
</div>
<div class="flex flex-col items-center justify-center border border-outline-variant bg-surface px-4 py-2 rounded-sm min-w-[80px]">
<span class="font-hud-sm text-hud-sm text-on-surface-variant mb-1">LEVEL</span>
<span class="font-label-bold text-label-bold text-secondary">04</span>
</div>
</div>
</div>
</div>
</body></html>
