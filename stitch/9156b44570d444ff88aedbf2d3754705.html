<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SUPERVISOR_OS_V1 - GAME OVER</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;800&amp;family=JetBrains+Mono:wght@600;700&amp;display=swap" rel="stylesheet"/>

    text-transform: none;
    display: inline-block;
    white-space: nowrap;
    word-wrap: normal;
    direction: ltr;
    -webkit-font-feature-settings: 'liga';
    -webkit-font-smoothing: antialiased;
  }
</style>

    darkMode: "class",
    theme: {
      extend: {
        "colors": {
                "surface-container-lowest": "#091009",

                "on-primary": "#003915",
                "on-secondary-fixed": "#2a1700",
                "on-primary-fixed-variant": "#005321",

                "primary-fixed": "#6bff8f",
                "surface-variant": "#2f372e",

                "outline": "#869585",
                "on-error-container": "#ffdad6",
                "surface-bright": "#333b33",
                "background": "#0e150e",
                "on-tertiary-fixed-variant": "#92002a",
                "on-background": "#dce5d9",
                "on-primary-container": "#004b1e",
                "primary-fixed-dim": "#4ae176",
                "tertiary": "#ffb3b7",
                "error-container": "#93000a",
                "on-surface-variant": "#bccbb9",
                "primary": "#4be277",
                "on-tertiary": "#67001b",
                "surface-container": "#1a221a",
                "inverse-surface": "#dce5d9",
                "inverse-primary": "#006e2f",
                "surface-dim": "#0e150e",
                "inverse-on-surface": "#2a322a",
                "primary-container": "#22c55e",
                "tertiary-fixed": "#ffdadb",
                "on-error": "#690005",
                "secondary": "#ffb95f",
                "surface-container-highest": "#2f372e",
                "tertiary-fixed-dim": "#ffb2b7",
                "on-primary-fixed": "#002109",
                "surface-container-high": "#242c24",
                "on-tertiary-container": "#840025",
                "tertiary-container": "#ff8892",
                "surface-tint": "#4ae176",
                "error": "#ffb4ab",
                "on-surface": "#dce5d9",
                "on-tertiary-fixed": "#40000d",
                "secondary-fixed": "#ffddb8",
                "outline-variant": "#3d4a3d"
        },
        "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"

        "spacing": {

                "gutter": "16px",

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop overflow-hidden">
<!-- Background Tonal Layering -->
<div class="fixed inset-0 pointer-events-none z-0">
<div class="absolute inset-0 bg-surface-container-lowest"></div>
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-error/5 via-surface/10 to-surface-container-lowest/80"></div>
<!-- Distressed Grid Overlay -->
<div class="absolute inset-0 opacity-[0.03]" style="background-image: linear-gradient(#3d4a3d 1px, transparent 1px), linear-gradient(90deg, #3d4a3d 1px, transparent 1px); background-size: 32px 32px;"></div>
</div>
<!-- Main Canvas -->
<main class="relative z-10 w-full max-w-2xl flex flex-col items-center gap-8">
<!-- Title Section -->
<div class="text-center space-y-4">
<h1 class="font-hud-lg text-hud-lg md:text-[64px] md:leading-none text-error tracking-tighter uppercase" style="text-shadow: 0 0 16px rgba(255, 180, 171, 0.4);">
        GAME OVER
      </h1>
<div class="font-hud-sm text-hud-sm text-on-surface-variant flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[16px]">warning</span>
        CRITICAL FAILURE DETECTED
        <span class="material-symbols-outlined text-[16px]">warning</span>
</div>
</div>
<!-- Stats Dashboard - Bento Grid Style -->
<div class="w-full grid grid-cols-2 md:grid-cols-3 gap-unit">
<!-- Final Score -->
<div class="col-span-2 md:col-span-3 bg-surface-container border border-outline-variant rounded flex flex-col items-center justify-center p-6 gap-2">
<div class="font-hud-sm text-hud-sm text-on-surface-variant uppercase">FINAL SCORE</div>
<div class="font-hud-lg text-hud-lg md:text-[48px] text-primary" style="text-shadow: 0 0 8px rgba(75, 226, 119, 0.3);">
          042,980
        </div>
</div>
<!-- Level Reached -->
<div class="col-span-1 bg-surface-container border border-outline-variant rounded flex flex-col items-center justify-center p-4 gap-2">
<span class="material-symbols-outlined text-secondary text-[24px]" style="font-variation-settings: 'FILL' 1;">layers</span>
<div class="font-hud-sm text-hud-sm text-on-surface-variant uppercase text-center">LEVEL</div>
<div class="font-label-bold text-label-bold text-on-surface text-xl">12</div>
</div>
<!-- Bricks Destroyed -->
<div class="col-span-1 bg-surface-container border border-outline-variant rounded flex flex-col items-center justify-center p-4 gap-2">
<span class="material-symbols-outlined text-primary text-[24px]" style="font-variation-settings: 'FILL' 1;">grid_4x4</span>
<div class="font-hud-sm text-hud-sm text-on-surface-variant uppercase text-center">BRICKS</div>
<div class="font-label-bold text-label-bold text-on-surface text-xl">342</div>
</div>
<!-- Playtime (Desktop Only for asymmetry) -->
<div class="hidden md:flex col-span-1 bg-surface-container border border-outline-variant rounded flex-col items-center justify-center p-4 gap-2">
<span class="material-symbols-outlined text-tertiary text-[24px]" style="font-variation-settings: 'FILL' 1;">timer</span>
<div class="font-hud-sm text-hud-sm text-on-surface-variant uppercase text-center">TIME</div>
<div class="font-label-bold text-label-bold text-on-surface text-xl">08:45</div>
</div>
</div>
<!-- Actions -->
<div class="w-full flex flex-col md:flex-row gap-4 mt-8">
<!-- Primary Action -->
<button class="flex-1 h-touch-target bg-surface-container border border-primary text-primary font-label-bold text-label-bold uppercase rounded flex items-center justify-center gap-2 hover:bg-primary-container/10 focus:outline-none focus:border-2 focus:border-primary transition-all shadow-[0_0_8px_rgba(75,226,119,0.2)]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">replay</span>
        PLAY AGAIN
      </button>
<!-- Secondary Action -->
<button class="flex-1 h-touch-target bg-surface-container border border-outline-variant text-on-surface font-label-bold text-label-bold uppercase rounded flex items-center justify-center gap-2 hover:border-primary hover:text-primary focus:outline-none focus:border-2 focus:border-primary transition-all">
<span class="material-symbols-outlined">menu</span>
        MAIN MENU
      </button>
</div>
</main>
</body></html>
