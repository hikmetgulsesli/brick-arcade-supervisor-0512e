<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Arcade Supervisor - Game Board</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;800&amp;family=JetBrains+Mono:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-lowest": "#091009",
                    "on-secondary": "#472a00",
                    "surface": "#0e150e",
                    "on-secondary-fixed-variant": "#653e00",
                    "on-primary": "#003915",
                    "on-secondary-fixed": "#2a1700",
                    "on-primary-fixed-variant": "#005321",
                    "secondary-fixed-dim": "#ffb95f",
                    "secondary-container": "#ee9800",
                    "primary-fixed": "#6bff8f",
                    "surface-variant": "#2f372e",
                    "on-secondary-container": "#5b3800",
                    "surface-container-low": "#161d16",
                    "outline": "#869585",
                    "on-error-container": "#ffdad6",
                    "surface-bright": "#333b33",
                    "background": "#0e150e",
                    "on-tertiary-fixed-variant": "#92002a",
                    "on-background": "#dce5d9",
                    "on-primary-container": "#004b1e",
                    "primary-fixed-dim": "#4ae176",
                    "tertiary": "#ffb3b7",
                    "error-container": "#93000a",
                    "on-surface-variant": "#bccbb9",
                    "primary": "#4be277",
                    "on-tertiary": "#67001b",
                    "surface-container": "#1a221a",
                    "inverse-surface": "#dce5d9",
                    "inverse-primary": "#006e2f",
                    "surface-dim": "#0e150e",
                    "inverse-on-surface": "#2a322a",
                    "primary-container": "#22c55e",
                    "tertiary-fixed": "#ffdadb",
                    "on-error": "#690005",
                    "secondary": "#ffb95f",
                    "surface-container-highest": "#2f372e",
                    "tertiary-fixed-dim": "#ffb2b7",
                    "on-primary-fixed": "#002109",
                    "surface-container-high": "#242c24",
                    "on-tertiary-container": "#840025",
                    "tertiary-container": "#ff8892",
                    "surface-tint": "#4ae176",
                    "error": "#ffb4ab",
                    "on-surface": "#dce5d9",
                    "on-tertiary-fixed": "#40000d",
                    "secondary-fixed": "#ffddb8",
                    "outline-variant": "#3d4a3d"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "unit": "4px",
                    "margin-mobile": "16px",
                    "gutter": "16px",
                    "margin-desktop": "32px",
                    "touch-target": "44px"
            },
            "fontFamily": {
                    "body-md": [
                            "Hanken Grotesk"
                    ],
                    "hud-sm": [
                            "JetBrains Mono"
                    ],
                    "hud-lg": [
                            "Hanken Grotesk"
                    ],
                    "label-bold": [
                            "JetBrains Mono"
                    ]
            },
            "fontSize": {
                    "body-md": [
                            "16px",
                            {
                                    "lineHeight": "1.5",
                                    "fontWeight": "400"
                            }
                    ],
                    "hud-sm": [
                            "12px",
                            {
                                    "lineHeight": "1.0",
                                    "letterSpacing": "0.1em",
                                    "fontWeight": "700"
                            }
                    ],
                    "hud-lg": [
                            "32px",
                            {
                                    "lineHeight": "1.1",
                                    "letterSpacing": "-0.02em",
                                    "fontWeight": "800"
                            }
                    ],
                    "label-bold": [
                            "14px",
                            {
                                    "lineHeight": "1.2",
                                    "fontWeight": "600"
                            }
                    ]
            }
    },
        },
      }
    </script>
<style>
        body {
            background-color: #0F172A; /* Deep Navy override for this specific design system */
            color: #dce5d9; /* on-background */
        }
        .glow-success {
            box-shadow: 0 0 10px #22c55e, inset 0 0 5px #22c55e;
        }
        .glow-warning {
            box-shadow: 0 0 10px #f59e0b, inset 0 0 5px #f59e0b;
        }
        .glow-paddle {
            box-shadow: 0 0 15px #4be277;
        }
        .glow-ball {
            box-shadow: 0 0 12px #dce5d9;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row antialiased">
<!-- SideNavBar (Desktop Only) -->
<nav class="hidden md:flex flex-col fixed left-0 top-0 h-full w-64 z-40 bg-surface-container dark:bg-surface-container border-r border-outline-variant">
<div class="p-margin-desktop border-b border-outline-variant">
<h1 class="font-hud-lg text-hud-lg text-primary tracking-tighter">CONSOLE</h1>
<p class="font-hud-sm text-hud-sm text-on-surface-variant mt-2">ARCADE_PROT_04</p>
</div>
<div class="flex-1 py-margin-desktop flex flex-col gap-unit">
<!-- Active Tab: DASHBOARD (Since this is the main game board) -->
<a class="flex items-center px-margin-desktop h-touch-target text-primary border-r-2 border-primary bg-surface-container-highest font-label-bold text-label-bold uppercase translate-x-1 transition-transform" href="#">
<span class="material-symbols-outlined mr-gutter" style="font-variation-settings: 'FILL' 1;">grid_view</span>
                DASHBOARD
            </a>
<a class="flex items-center px-margin-desktop h-touch-target text-on-surface-variant hover:text-on-surface hover:bg-surface-variant transition-all font-label-bold text-label-bold uppercase" href="#">
<span class="material-symbols-outlined mr-gutter">tune</span>
                MODIFIERS
            </a>
<a class="flex items-center px-margin-desktop h-touch-target text-on-surface-variant hover:text-on-surface hover:bg-surface-variant transition-all font-label-bold text-label-bold uppercase" href="#">
<span class="material-symbols-outlined mr-gutter">monitoring</span>
                ANALYTICS
            </a>
<a class="flex items-center px-margin-desktop h-touch-target text-on-surface-variant hover:text-on-surface hover:bg-surface-variant transition-all font-label-bold text-label-bold uppercase" href="#">
<span class="material-symbols-outlined mr-gutter">terminal</span>
                LOGS
            </a>
</div>
</nav>
<!-- Main Content Canvas -->
<main class="flex-1 md:ml-64 flex flex-col min-h-screen relative pb-[80px] md:pb-0">
<!-- TopAppBar (Universal Header) -->
<header class="fixed top-0 left-0 md:left-64 right-0 z-50 flex justify-between items-center px-margin-mobile md:px-margin-desktop h-touch-target bg-surface dark:bg-surface border-b border-outline-variant dark:border-outline-variant">
<div class="font-hud-lg text-hud-lg font-black text-primary dark:text-primary uppercase tracking-tighter">SUPERVISOR_OS_V1</div>
<div class="flex items-center gap-gutter">
<button class="text-on-surface-variant hover:border-primary transition-colors duration-200 h-touch-target w-touch-target flex items-center justify-center rounded border border-transparent">
<span class="material-symbols-outlined">settings</span>
</button>
<button class="text-on-surface-variant hover:border-primary transition-colors duration-200 h-touch-target w-touch-target flex items-center justify-center rounded border border-transparent">
<span class="material-symbols-outlined">help_outline</span>
</button>
</div>
</header>
<!-- Playfield Area -->
<div class="flex-1 mt-[44px] flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Game Container -->
<div class="w-full max-w-4xl aspect-[4/3] md:aspect-[16/9] bg-[#111827] border border-[#334155] rounded-lg relative overflow-hidden flex flex-col shadow-[0_0_20px_rgba(0,0,0,0.5)]">
<!-- In-Game HUD -->
<div class="h-12 w-full border-b border-[#334155] bg-[#0F172A]/80 flex justify-between items-center px-gutter backdrop-blur-sm z-10">
<div class="flex gap-gutter">
<div class="border border-[#334155] bg-[#111827] px-3 py-1 flex items-center gap-2">
<span class="font-hud-sm text-hud-sm text-on-surface-variant">SCORE</span>
<span class="font-hud-sm text-hud-sm text-primary">02450</span>
</div>
<div class="border border-[#334155] bg-[#111827] px-3 py-1 flex items-center gap-2">
<span class="font-hud-sm text-hud-sm text-on-surface-variant">LVL</span>
<span class="font-hud-sm text-hud-sm text-inverse-surface">04</span>
</div>
</div>
<div class="flex gap-unit">
<!-- Lives -->
<span class="material-symbols-outlined text-primary text-[18px]" style="font-variation-settings: 'FILL' 1;">favorite</span>
<span class="material-symbols-outlined text-primary text-[18px]" style="font-variation-settings: 'FILL' 1;">favorite</span>
<span class="material-symbols-outlined text-outline-variant text-[18px]">favorite</span>
</div>
</div>
<!-- Bricks Grid -->
<div class="absolute top-16 left-0 w-full px-[5%] grid grid-cols-8 gap-[4px] z-0">
<!-- Row 1 -->
<div class="h-6 bg-primary-container glow-success"></div>
<div class="h-6 bg-primary-container glow-success"></div>
<div class="h-6 bg-[#f59e0b] glow-warning"></div>
<div class="h-6 bg-primary-container glow-success"></div>
<div class="h-6 bg-primary-container glow-success"></div>
<div class="h-6 bg-[#f59e0b] glow-warning"></div>
<div class="h-6 bg-primary-container glow-success"></div>
<div class="h-6 bg-primary-container glow-success"></div>
<!-- Row 2 -->
<div class="h-6 bg-primary-container glow-success"></div>
<div class="h-6 bg-[#f59e0b] glow-warning"></div>
<div class="h-6 bg-transparent border border-outline-variant opacity-20"></div> <!-- Destroyed -->
<div class="h-6 bg-primary-container glow-success"></div>
<div class="h-6 bg-[#f59e0b] glow-warning"></div>
<div class="h-6 bg-primary-container glow-success"></div>
<div class="h-6 bg-transparent border border-outline-variant opacity-20"></div>
<div class="h-6 bg-primary-container glow-success"></div>
<!-- Row 3 -->
<div class="h-6 bg-primary-container glow-success"></div>
<div class="h-6 bg-primary-container glow-success"></div>
<div class="h-6 bg-primary-container glow-success"></div>
<div class="h-6 bg-primary-container glow-success"></div>
<div class="h-6 bg-transparent border border-outline-variant opacity-20"></div>
<div class="h-6 bg-primary-container glow-success"></div>
<div class="h-6 bg-primary-container glow-success"></div>
<div class="h-6 bg-primary-container glow-success"></div>
</div>
<!-- Ball -->
<div class="absolute top-1/2 left-1/3 w-4 h-4 bg-inverse-surface rounded-full glow-ball z-20"></div>
<!-- Paddle -->
<div class="absolute bottom-6 left-[40%] w-[20%] h-4 bg-primary glow-paddle rounded-sm z-20"></div>
<!-- Quick Controls (Overlay bottom right) -->
<div class="absolute bottom-4 right-4 flex gap-unit z-30">
<button class="h-10 w-10 bg-[#111827] border border-[#334155] text-on-surface-variant hover:border-primary hover:text-primary transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]">pause</span>
</button>
<button class="h-10 w-10 bg-[#111827] border border-[#334155] text-on-surface-variant hover:border-primary hover:text-primary transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]">refresh</span>
</button>
</div>
</div>
<!-- Mobile Touch Controls (Visible only on small screens) -->
<div class="mt-margin-mobile flex w-full max-w-md justify-between md:hidden gap-gutter">
<button class="flex-1 h-14 bg-[#111827] border border-[#334155] active:border-primary active:text-primary flex items-center justify-center rounded transition-colors focus:border-primary focus:outline-none">
<span class="material-symbols-outlined text-[32px]">arrow_left</span>
</button>
<button class="flex-1 h-14 bg-[#111827] border border-[#334155] active:border-primary active:text-primary flex items-center justify-center rounded transition-colors focus:border-primary focus:outline-none">
<span class="material-symbols-outlined text-[32px]">arrow_right</span>
</button>
</div>
</div>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 h-16 md:hidden bg-surface-container-low dark:bg-surface-container-low border-t border-outline-variant">
<!-- Active Tab: PLAY (Matches game board intent) -->
<a class="flex flex-col items-center justify-center text-primary bg-primary-container/10 rounded-xl p-unit min-w-[64px] scale-90 transition-transform font-hud-sm text-hud-sm uppercase" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
            PLAY
        </a>
<a class="flex flex-col items-center justify-center text-on-surface-variant opacity-70 hover:opacity-100 transition-opacity min-w-[64px] font-hud-sm text-hud-sm uppercase" href="#">
<span class="material-symbols-outlined mb-1">settings_input_component</span>
            GEAR
        </a>
<a class="flex flex-col items-center justify-center text-on-surface-variant opacity-70 hover:opacity-100 transition-opacity min-w-[64px] font-hud-sm text-hud-sm uppercase" href="#">
<span class="material-symbols-outlined mb-1">leaderboard</span>
            STATS
        </a>
<a class="flex flex-col items-center justify-center text-on-surface-variant opacity-70 hover:opacity-100 transition-opacity min-w-[64px] font-hud-sm text-hud-sm uppercase" href="#">
<span class="material-symbols-outlined mb-1">power_settings_new</span>
            EXIT
        </a>
</nav>
</body></html>
