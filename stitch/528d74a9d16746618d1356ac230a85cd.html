<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Arcade Prototype - Level Complete</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;800&amp;family=JetBrains+Mono:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#091009",
                        "on-secondary": "#472a00",
                        "surface": "#0e150e",
                        "on-secondary-fixed-variant": "#653e00",
                        "on-primary": "#003915",
                        "on-secondary-fixed": "#2a1700",
                        "on-primary-fixed-variant": "#005321",
                        "secondary-fixed-dim": "#ffb95f",
                        "secondary-container": "#ee9800",
                        "primary-fixed": "#6bff8f",
                        "surface-variant": "#2f372e",
                        "on-secondary-container": "#5b3800",
                        "surface-container-low": "#161d16",
                        "outline": "#869585",
                        "on-error-container": "#ffdad6",
                        "surface-bright": "#333b33",
                        "background": "#0e150e",
                        "on-tertiary-fixed-variant": "#92002a",
                        "on-background": "#dce5d9",
                        "on-primary-container": "#004b1e",
                        "primary-fixed-dim": "#4ae176",
                        "tertiary": "#ffb3b7",
                        "error-container": "#93000a",
                        "on-surface-variant": "#bccbb9",
                        "primary": "#4be277",
                        "on-tertiary": "#67001b",
                        "surface-container": "#1a221a",
                        "inverse-surface": "#dce5d9",
                        "inverse-primary": "#006e2f",
                        "surface-dim": "#0e150e",
                        "inverse-on-surface": "#2a322a",
                        "primary-container": "#22c55e",
                        "tertiary-fixed": "#ffdadb",
                        "on-error": "#690005",
                        "secondary": "#ffb95f",
                        "surface-container-highest": "#2f372e",
                        "tertiary-fixed-dim": "#ffb2b7",
                        "on-primary-fixed": "#002109",
                        "surface-container-high": "#242c24",
                        "on-tertiary-container": "#840025",
                        "tertiary-container": "#ff8892",
                        "surface-tint": "#4ae176",
                        "error": "#ffb4ab",
                        "on-surface": "#dce5d9",
                        "on-tertiary-fixed": "#40000d",
                        "secondary-fixed": "#ffddb8",
                        "outline-variant": "#3d4a3d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "margin-mobile": "16px",
                        "gutter": "16px",
                        "margin-desktop": "32px",
                        "touch-target": "44px"
                    },
                    "fontFamily": {
                        "body-md": ["Hanken Grotesk"],
                        "hud-sm": ["JetBrains Mono"],
                        "hud-lg": ["Hanken Grotesk"],
                        "label-bold": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "hud-sm": ["12px", { "lineHeight": "1.0", "letterSpacing": "0.1em", "fontWeight": "700" }],
                        "hud-lg": ["32px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "label-bold": ["14px", { "lineHeight": "1.2", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .neon-glow { box-shadow: 0 0 10px rgba(75, 226, 119, 0.5), inset 0 0 5px rgba(75, 226, 119, 0.3); }
        .grid-bg {
            background-image: linear-gradient(to right, rgba(61, 74, 61, 0.2) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(61, 74, 61, 0.2) 1px, transparent 1px);
            background-size: 32px 32px;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col grid-bg">
<main class="flex-1 flex items-center justify-center p-margin-mobile md:p-margin-desktop z-10 relative">
<div class="max-w-2xl w-full mx-auto flex flex-col gap-8">
<div class="text-center space-y-4">
<span class="material-symbols-outlined text-[64px] text-primary" style="font-variation-settings: 'FILL' 1;">emoji_events</span>
<h1 class="font-hud-lg text-hud-lg text-primary uppercase neon-glow p-4 border border-primary bg-surface inline-block">Level Complete</h1>
<p class="font-hud-sm text-hud-sm text-on-surface-variant uppercase">Sector Cleared - Awaiting Next Protocol</p>
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
<div class="bg-surface border border-outline-variant p-4 flex flex-col gap-2">
<span class="font-hud-sm text-hud-sm text-on-surface-variant">Base Score</span>
<span class="font-label-bold text-label-bold text-on-surface text-2xl">45,200</span>
</div>
<div class="bg-surface border border-outline-variant p-4 flex flex-col gap-2">
<span class="font-hud-sm text-hud-sm text-on-surface-variant">Time Bonus</span>
<span class="font-label-bold text-label-bold text-secondary text-2xl">+12,500</span>
</div>
<div class="bg-surface border border-outline-variant p-4 flex flex-col gap-2">
<span class="font-hud-sm text-hud-sm text-on-surface-variant">Accuracy</span>
<span class="font-label-bold text-label-bold text-on-surface text-2xl">94%</span>
</div>
<div class="bg-surface border border-primary p-4 flex flex-col gap-2 neon-glow">
<span class="font-hud-sm text-hud-sm text-primary">Total Rating</span>
<span class="font-hud-lg text-hud-lg text-primary">57,700</span>
</div>
</div>
<div class="flex flex-col sm:flex-row gap-4 mt-8 justify-center">
<button class="h-touch-target px-8 bg-surface border border-outline-variant text-on-surface font-label-bold text-label-bold hover:border-primary transition-colors duration-200 uppercase flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">replay</span>
                    Restart
                </button>
<button class="h-touch-target px-8 bg-surface border-2 border-primary text-primary font-label-bold text-label-bold hover:bg-primary hover:text-surface transition-colors duration-200 uppercase neon-glow flex items-center justify-center gap-2">
                    Next Level
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
<div class="text-center mt-4">
<button class="text-on-surface-variant hover:text-primary font-hud-sm text-hud-sm transition-colors duration-200">Return to Menu</button>
</div>
</div>
</main>
</body></html>
