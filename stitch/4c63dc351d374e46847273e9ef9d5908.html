<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Brick Arcade Supervisor</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;800&amp;family=JetBrains+Mono:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#091009",
                        "on-secondary": "#472a00",
                        "surface": "#0e150e",
                        "on-secondary-fixed-variant": "#653e00",
                        "on-primary": "#003915",
                        "on-secondary-fixed": "#2a1700",
                        "on-primary-fixed-variant": "#005321",
                        "secondary-fixed-dim": "#ffb95f",
                        "secondary-container": "#ee9800",
                        "primary-fixed": "#6bff8f",
                        "surface-variant": "#2f372e",
                        "on-secondary-container": "#5b3800",
                        "surface-container-low": "#161d16",
                        "outline": "#869585",
                        "on-error-container": "#ffdad6",
                        "surface-bright": "#333b33",
                        "background": "#0e150e",
                        "on-tertiary-fixed-variant": "#92002a",
                        "on-background": "#dce5d9",
                        "on-primary-container": "#004b1e",
                        "primary-fixed-dim": "#4ae176",
                        "tertiary": "#ffb3b7",
                        "error-container": "#93000a",
                        "on-surface-variant": "#bccbb9",
                        "primary": "#4be277",
                        "on-tertiary": "#67001b",
                        "surface-container": "#1a221a",
                        "inverse-surface": "#dce5d9",
                        "inverse-primary": "#006e2f",
                        "surface-dim": "#0e150e",
                        "inverse-on-surface": "#2a322a",
                        "primary-container": "#22c55e",
                        "tertiary-fixed": "#ffdadb",
                        "on-error": "#690005",
                        "secondary": "#ffb95f",
                        "surface-container-highest": "#2f372e",
                        "tertiary-fixed-dim": "#ffb2b7",
                        "on-primary-fixed": "#002109",
                        "surface-container-high": "#242c24",
                        "on-tertiary-container": "#840025",
                        "tertiary-container": "#ff8892",
                        "surface-tint": "#4ae176",
                        "error": "#ffb4ab",
                        "on-surface": "#dce5d9",
                        "on-tertiary-fixed": "#40000d",
                        "secondary-fixed": "#ffddb8",
                        "outline-variant": "#3d4a3d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "margin-mobile": "16px",
                        "gutter": "16px",
                        "margin-desktop": "32px",
                        "touch-target": "44px"
                    },
                    "fontFamily": {
                        "body-md": ["Hanken Grotesk"],
                        "hud-sm": ["JetBrains Mono"],
                        "hud-lg": ["Hanken Grotesk"],
                        "label-bold": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "hud-sm": ["12px", { "lineHeight": "1.0", "letterSpacing": "0.1em", "fontWeight": "700" }],
                        "hud-lg": ["32px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "label-bold": ["14px", { "lineHeight": "1.2", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #0F172A; /* Deep Navy foundation as per style guidance */
        }
        .hud-glow {
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.3);
        }
        .scanline {
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px;
        }
    </style>
</head>
<body class="text-on-background h-screen flex flex-col overflow-hidden font-body-md relative scanline">
<!-- Playfield Area -->
<main class="flex-grow flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop z-10">
<div class="max-w-2xl w-full flex flex-col items-center gap-8">
<!-- Branding / Title -->
<div class="text-center space-y-2 mb-8">
<p class="font-hud-sm text-hud-sm text-primary uppercase">System Ready</p>
<h1 class="font-hud-lg text-hud-lg md:text-5xl lg:text-6xl text-on-surface uppercase tracking-tighter">
                    BRICK ARCADE <span class="text-primary">SUPERVISOR</span>
</h1>
<div class="w-full h-px bg-outline-variant mt-4 relative">
<div class="absolute left-1/2 transform -translate-x-1/2 -top-1 w-8 h-2 bg-primary"></div>
</div>
</div>
<!-- Main Menu Options -->
<div class="flex flex-col gap-4 w-full max-w-sm">
<!-- Primary Action -->
<button class="bg-[#111827] border border-[#334155] hover:border-primary text-on-surface hover:text-primary transition-colors duration-200 h-16 flex items-center justify-center gap-3 relative overflow-hidden group">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform">play_arrow</span>
<span class="font-label-bold text-label-bold uppercase">START GAME</span>
<div class="absolute inset-0 bg-primary/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
</button>
<!-- Help Action -->
<button class="bg-[#111827] border border-[#334155] hover:border-primary text-on-surface hover:text-primary transition-colors duration-200 h-12 flex items-center justify-center gap-3 group">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">help_outline</span>
<span class="font-label-bold text-label-bold uppercase text-on-surface-variant group-hover:text-primary transition-colors">HOW TO PLAY</span>
</button>
<!-- Settings Action -->
<button class="bg-[#111827] border border-[#334155] hover:border-primary text-on-surface hover:text-primary transition-colors duration-200 h-12 flex items-center justify-center gap-3 group">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">settings</span>
<span class="font-label-bold text-label-bold uppercase text-on-surface-variant group-hover:text-primary transition-colors">SETTINGS</span>
</button>
</div>
</div>
</main>
<!-- Metadata / Bottom Bar -->
<footer class="w-full flex justify-between items-end p-margin-mobile md:p-margin-desktop z-10 border-t border-outline-variant bg-[#111827]/80 backdrop-blur-sm">
<!-- High Score HUD Chip -->
<div class="border border-[#334155] bg-[#111827] px-3 py-2 flex flex-col items-start min-w-[120px]">
<span class="font-hud-sm text-hud-sm text-on-surface-variant uppercase mb-1">HIGH SCORE</span>
<span class="font-label-bold text-label-bold text-primary">09,482,100</span>
</div>
<!-- Version Metadata -->
<div class="text-right flex flex-col items-end opacity-70">
<span class="font-hud-sm text-hud-sm text-on-surface uppercase">v2.4.1-rc</span>
<span class="font-hud-sm text-hud-sm text-on-surface-variant uppercase mt-1">OS_V1_CORE</span>
</div>
</footer>
<!-- Background Decorative Elements -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden flex items-center justify-center opacity-10">
<div class="w-full h-full border border-primary/20 absolute m-margin-desktop hidden md:block"></div>
<div class="absolute top-1/4 left-1/4 w-32 h-32 border border-primary rounded-full blur-[100px] bg-primary/20"></div>
<div class="absolute bottom-1/4 right-1/4 w-48 h-48 border border-secondary rounded-full blur-[120px] bg-secondary/10"></div>
</div>
</body></html>
